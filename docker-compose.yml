services:
  redis:
    image: redis:7
    container_name: chat-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  kafka:
    image: apache/kafka:latest
    container_name: chat-kafka

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_LISTENERS: >
        PLAINTEXT://:9092,
        PLAINTEXT_INTERNAL://:29092,
        CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: >
        PLAINTEXT://localhost:9092,
        PLAINTEXT_INTERNAL://kafka:29092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >
        PLAINTEXT:PLAINTEXT,
        PLAINTEXT_INTERNAL:PLAINTEXT,
        CONTROLLER:PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    restart: unless-stopped

  mongodb:
    image: mongo:latest
    container_name: chat-mongodb

    ports:
      - "27017:27017"
    restart: unless-stopped


  django:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: chat-django

    command: >
      daphne
      -b 0.0.0.0
      -p 8000
      config.asgi:application

    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - .env

    environment:

      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MONGO_URI: mongodb://mongodb:27017/
      POSTGRES_HOST: host.docker.internal

    depends_on:
      - redis
      - kafka
      - mongodb
    restart: unless-stopped

  celery:
    build:
      context: .

      dockerfile: Dockerfile

    container_name: chat-celery

    command: >
      celery
      -A config
      worker
      --loglevel=info

    env_file:
      - .env

    environment:
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MONGO_URI: mongodb://mongodb:27017/
      POSTGRES_HOST: host.docker.internal

    depends_on:
      - redis
      - kafka
      - mongodb
    restart: unless-stopped

  notification-consumer:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: chat-notification-consumer

    command: >
      python
      chats/kafka_consumer.py

    env_file:
      - .env

    environment:
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MONGO_URI: mongodb://mongodb:27017/
      POSTGRES_HOST: host.docker.internal

    depends_on:
      - redis
      - kafka
      - mongodb

    restart: unless-stopped

  audit-consumer:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: chat-audit-consumer

    command: >
      python
      chats/audit_consumer.py

    env_file:
      - .env

    environment:
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MONGO_URI: mongodb://mongodb:27017/
      POSTGRES_HOST: host.docker.internal

    depends_on:
      - kafka
      - mongodb
    restart: unless-stopped